name: Lint

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5.2.7
      - name: Run Lint
        run: mise run lint

  govulncheck:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: berquerant/govulncheck-action@v1.0.4
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

  actions-lock-verify:
    permissions:
      contents: read
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.1.0
