name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read # checkout repository for Go CI
    uses: berquerant/reusable-workflows/.github/workflows/go-ci.yml@v0.4.0
    with:
      setup-mode: mise
      lint-command: mise run lint
      test-command: mise run test
      build-command: mise run build
      timeout-minutes: 10

  actions-lock-verify:
    permissions:
      contents: read # checkout repository and verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.4.0
